# Lambda Architecture platform: Kafka, PostgreSQL, pipeline services and
# (optional, profile "airflow") Apache Airflow orchestration.
services:
  # ----------------------------------------------------
  # Ingestion Engine: Apache Kafka (KRaft Mode)
  # ----------------------------------------------------
  # Switched from bitnami/kafka to the official apache/kafka image: the Bitnami
  # images were moved to the "bitnamilegacy" repository in 2025 and
  # `bitnami/kafka:3.7.0` no longer resolves (Docker Hub returns 404), which
  # made `docker compose up` fail with "manifest unknown".
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.7.0
    container_name: fleet-kafka
    ports:
      # Publish both broker listeners for external demo clients.
      - "9092:9092"
      - "9094:9094"
    environment:
      # The apache/kafka image maps KAFKA_* env vars onto broker properties and
      # applies none of its defaults when any override is present.
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      - KAFKA_LOG_DIRS=/tmp/kafka-logs
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - fleet-net
    volumes:
      - kafka-data:/tmp/kafka-logs

  # ----------------------------------------------------
  # Storage & Serving Layer: PostgreSQL
  # ----------------------------------------------------
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    container_name: fleet-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - ./storage/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Data Generator: Streaming Telemetry Producer (Kafka)
  # ----------------------------------------------------
  streaming-producer:
    restart: unless-stopped
    build: .
    container_name: fleet-streaming-producer
    command: python data_generator/streaming_producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TELEMETRY_TOPIC=fleet-telemetry
    volumes:
      - shared-data-lake:/app/data_lake
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Data Generator: Batch Daily Expense Generator
  # ----------------------------------------------------
  batch-generator:
    restart: unless-stopped
    build: .
    container_name: fleet-batch-generator
    command: python data_generator/batch_generator.py
    environment:
      - CONFIG_PATH=config/config.yaml
    volumes:
      - shared-data-lake:/app/data_lake
    depends_on:
      - postgres
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Processing: Speed Layer (Streaming Processor)
  # ----------------------------------------------------
  speed-layer:
    restart: unless-stopped
    build: .
    container_name: fleet-speed-layer
    command: python streaming_layer/spark_streaming_job.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TELEMETRY_TOPIC=fleet-telemetry
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - IDLE_ALERT_THRESHOLD_SEC=60
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Processing: Batch Layer (Reconciliation Engine)
  # ----------------------------------------------------
  batch-layer:
    restart: unless-stopped
    build: .
    container_name: fleet-batch-layer
    command: python batch_layer/scheduled_runner.py
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - DATA_DROP_DIR=/app/data_lake/daily_expenses
      - RAW_TELEMETRY_DIR=/app/data_lake/raw_telemetry
      - PARQUET_OUTPUT_DIR=/app/data_lake/reconciled_reports
      - BATCH_INTERVAL_SEC=30
    volumes:
      - shared-data-lake:/app/data_lake
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Serving Layer: FastAPI Backend
  # ----------------------------------------------------
  api:
    restart: unless-stopped
    build: .
    container_name: fleet-api
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - STALE_DATA_THRESHOLD_SEC=60
      - CORS_ALLOW_ORIGINS=*
    healthcheck:
      # Health rule exposed for orchestrators and `docker compose ps`.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Serving Layer: Streamlit Dashboard UI
  # ----------------------------------------------------
  dashboard:
    restart: unless-stopped
    build: .
    container_name: fleet-dashboard
    command: streamlit run serving/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - fleet-net

  # ----------------------------------------------------
  # Orchestration (optional): Apache Airflow
  # ----------------------------------------------------
  # Opt-in: `docker compose --profile airflow up -d`.
  # Runs the same reconciliation engine as the `batch-layer` service, so run
  # either the lightweight scheduled runner or Airflow (both are idempotent,
  # but running both just duplicates work).
  airflow:
    restart: unless-stopped
    image: apache/airflow:2.8.1-python3.10
    container_name: fleet-airflow
    profiles: ["airflow"]
    command: airflow standalone
    ports:
      - "8080:8080"
    environment:
      - DB_ENGINE=postgres
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      # Keeps the demo self-contained (SQLite metadata DB + SequentialExecutor).
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - DATA_DROP_DIR=/app/data_lake/daily_expenses
      - ARCHIVE_DIR=/app/data_lake/archived_expenses
      - REPORT_OUTPUT_DIR=/app/data_lake/consolidated_reports
      - RAW_TELEMETRY_DIR=/app/data_lake/raw_telemetry
      - PARQUET_OUTPUT_DIR=/app/data_lake/reconciled_reports
      # Airflow needs the pipeline dependencies inside its own image.
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas==2.2.0 pyarrow==15.0.0 psycopg2-binary==2.9.9 pyyaml==6.0.1
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app
      - shared-data-lake:/app/data_lake
      - airflow-home:/opt/airflow
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  shared-data-lake:
  airflow-home:
